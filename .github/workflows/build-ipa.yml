name: Build iOS IPA

# Runs once per push. Pull requests from these branches show the same results, so there's no
# separate pull_request run.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

# A newer push to the same work branch stops the build that's still going (main and tags always finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/claude/') }}

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (Release, unsigned)
        env:
          # Optional repository variables (Settings -> Secrets and variables -> Actions) that
          # point the build at a different Supabase project than the one in project.yml.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          set -o pipefail
          overrides=()
          if [ -n "$SUPABASE_URL" ]; then overrides+=("SUPABASE_URL=$SUPABASE_URL"); fi
          if [ -n "$SUPABASE_KEY" ]; then overrides+=("SUPABASE_KEY=$SUPABASE_KEY"); fi
          xcodebuild \
            -project ForgeFit.xcodeproj \
            -scheme ForgeFit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ${overrides[@]+"${overrides[@]}"} \
            build | tee xcodebuild.log | grep -E "error:|warning: .*(deprecated|will be an error)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/ForgeFit.app
          echo "Accounts project: $(/usr/libexec/PlistBuddy -c 'Print :SupabaseURL' build/Build/Products/Release-iphoneos/ForgeFit.app/Info.plist || echo none)"

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" xcodebuild.log | head -100 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ForgeFit.app Payload/
          zip -qry ForgeFit.ipa Payload
          ls -lh ForgeFit.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeFit-ipa
          path: ForgeFit.ipa
          if-no-files-found: error

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ForgeFit.ipa
