name: UI Tests & Screenshots

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["claude/**"]
    paths:
      - "ForgeFit/**"
      - "ForgeFitWidgets/**"
      - "Shared/**"
      - "ForgeFitUITests/**"
      - "project.yml"
      - ".github/workflows/ui-tests.yml"

jobs:
  ui-tests:
    name: Run UI tests on iPhone simulator
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in data if "iOS" in r), reverse=True)
          for runtime in runtimes:
              phones = [d for d in data[runtime] if d["name"].startswith("iPhone")]
              pro = [d for d in phones if "Pro" in d["name"] and "Max" not in d["name"]]
              pick = (pro or phones)
              if pick:
                  print(pick[0]["udid"]); break
          ')
          echo "Using simulator $UDID"
          xcrun simctl list devices | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ForgeFit.xcodeproj \
            -scheme ForgeFit \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log | grep -E "error:|Test Case .*(passed|failed)|\*\* TEST|XCTAssert" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild-test.log

      - name: Show failures
        if: failure()
        run: grep -E "error|failed|Assert" xcodebuild-test.log | head -80 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ForgeFit-screenshots
          path: ~/forgefit-screens
          if-no-files-found: warn

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ForgeFit-test-results
          path: TestResults.xcresult
