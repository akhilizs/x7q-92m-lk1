name: ForgeFit
options:
  bundleIdPrefix: com.forgefit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Accounts & cloud save (see README). The publishable key is meant to ship in apps:
    # row level security (supabase/setup.sql) limits every account to its own data.
    # Never put a secret key (sb_secret_…) here. Empty values = offline only.
    SUPABASE_URL: https://tfadnmwxuinvcbuanylq.supabase.co
    SUPABASE_KEY: sb_publishable_e4xnf0YbNYcefKwn9wTSnw_pVMLfSG0

targets:
  ForgeFit:
    type: application
    platform: iOS
    sources:
      - path: ForgeFit
    info:
      path: ForgeFit/Info.plist
      properties:
        CFBundleDisplayName: ForgeFit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: $(SUPABASE_URL)
        SupabaseKey: $(SUPABASE_KEY)
        # Email confirmation and password-reset links open the app (forgefit://auth-callback).
        CFBundleURLTypes:
          - CFBundleURLName: com.forgefit.app.auth
            CFBundleURLSchemes:
              - forgefit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgefit.app
        PRODUCT_NAME: ForgeFit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

  ForgeFitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ForgeFitUITests
    dependencies:
      - target: ForgeFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgefit.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ForgeFit
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  ForgeFit:
    build:
      targets:
        ForgeFit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ForgeFitUITests
    archive:
      config: Release
